<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in sandbox iframe (HMR disabled)
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('createWebSocketModuleRunnerTransport') !== -1 || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = e.reason && (e.reason.message || e.reason.stack || String(e.reason)) || '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1 || str.indexOf('@vite/client') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>KaizenAuto - Automotive Defect & Countermeasure Intelligence</title>
    <meta name="description" content="Real-time automotive defect logging, 5-Why root cause analysis, Kaizen countermeasure tracking, Andon alerts, and production quality analytics." />
    <meta property="og:title" content="KaizenAuto - Automotive Defect & Countermeasure Intelligence" />
    <meta property="og:description" content="Real-time automotive defect logging, 5-Why root cause analysis, Kaizen countermeasure tracking, Andon alerts, and production quality analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .font-mono, .tabular-nums {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
